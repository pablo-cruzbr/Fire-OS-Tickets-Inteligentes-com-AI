name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Valor só de teste: a API assina e valida os JWTs com ele. Localmente
      # vem do Backend/.env, que não existe no CI.
      JWT_SECREATE: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # O undici puxado pelo testcontainers quebra no Node 20
          # ("webidl.util.markAsUncloneable is not a function").
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./Backend

      - name: Type-check
        run: npm run typecheck
        working-directory: ./Backend

      - name: Lint
        run: npm run lint
        working-directory: ./Backend

      - name: Run tests
        run: npm run test
        working-directory: ./Backend

      - name: Run integration/E2E tests
        # Sobe um Postgres efêmero via TestContainers (o runner do GitHub
        # Actions já vem com Docker) — não usa nem toca o banco real do
        # .env, só o que o próprio teste cria e derruba sozinho.
        run: npm run test:integration
        working-directory: ./Backend
